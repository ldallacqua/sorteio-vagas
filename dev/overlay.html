<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Conferência do mapa</title>
<style>
  body { margin: 0; background: #222; font: 14px system-ui; color: #eee; }
  /* a página inteira do PDF, em unidades do mapa (ver dev/extract_map.py) */
  .wrap { position: relative; width: 1666.8px; height: 1178.6px; transform-origin: 0 0; }
  .wrap img, .wrap svg { position: absolute; inset: 0; width: 1666.8px; height: 1178.6px; }
  polygon { fill: rgba(0, 120, 255, .12); stroke: #06f; stroke-width: 1; }
  polygon.block { fill: rgba(255, 0, 255, .12); stroke: #f0f; }
  polygon.area, polygon.ground { fill: none; stroke: #0a0; stroke-dasharray: 4 3; }
  polygon.special { fill: rgba(0, 0, 0, .2); stroke: #000; }
  line { stroke-width: 2.4; }
  text { font: 700 8px system-ui; fill: #d00; text-anchor: middle; }
</style>
<div class="wrap" id="wrap">
  <img src="../img/mapa-original.jpg" alt="">
  <svg id="svg" viewBox="0 0 1666.8 1178.6"></svg>
</div>
<script src="../data.js"></script>
<script>
  const L = window.LOT, p = (pts) => pts.map((q) => q.join(',')).join(' ');
  const color = { G: '#0b0', M: '#e6b800', P: '#e00' };
  let h = `<polygon class="ground" points="${p(L.ground)}"/>`;
  h += L.areas.map((a) => `<polygon class="area" points="${p(a)}"/>`).join('');
  h += L.blocks.map((b) => `<polygon class="block" points="${p(b.pts)}"/>`).join('');
  h += L.special.map((s) => `<polygon class="special" points="${p(s.pts)}"/>`).join('');
  h += L.spots.map((s) => `<polygon points="${p(s.pts)}"/><line x1="${s.sizeLine[0][0]}" y1="${s.sizeLine[0][1]}" x2="${s.sizeLine[1][0]}" y2="${s.sizeLine[1][1]}" stroke="${color[s.size]}"/><text x="${s.c[0]}" y="${s.c[1] + 12}">${s.n}</text>`).join('');
  document.getElementById('svg').innerHTML = h;
  const q = new URLSearchParams(location.search);
  const z = +q.get('z') || 1, ox = +q.get('x') || 0, oy = +q.get('y') || 0;
  document.getElementById('wrap').style.transform = `scale(${z}) translate(${-ox}px, ${-oy}px)`;
  document.title = `${L.spots.length} vagas`;
</script>
</html>
